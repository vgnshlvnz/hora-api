# hora-api and its MCP server. Run from this directory:  docker compose up -d --build
# Configuration comes from deploy/.env (copy env.example); nothing secret lives in this file.
name: hora-api

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    image: hora-api:local
    restart: unless-stopped
    labels:
      hora.autorestart: "true"   # opts in to the watcher below
    environment:
      # Plain HTTP on the LAN: keys are mandatory, so this refuses to start without them.
      API_KEYS: ${API_KEYS:?set API_KEYS in deploy/.env}
      # Per-subscriber keys with tiers (see docs/self-hosting.md): the file is optional.
      KEYS_PATH: /keys/keys.yaml
      DEFAULT_LAT: ${DEFAULT_LAT:-3.107}
      DEFAULT_LON: ${DEFAULT_LON:-101.606}
      DEFAULT_TZ: ${DEFAULT_TZ:-Asia/Kuala_Lumpur}
    volumes:
      # Profiles live outside the repo, read-only in the container.
      - ${PROFILES_DIR:?set PROFILES_DIR in deploy/.env}:/profiles:ro
      - ${KEYS_DIR:-./keys}:/keys:ro
    ports:
      - "${API_PUBLISH:-0.0.0.0:8000}:8000"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: mcp
    image: hora-mcp:local
    restart: unless-stopped
    labels:
      hora.autorestart: "true"
    depends_on:
      api:
        condition: service_healthy
    environment:
      HORA_API_URL: http://api:8000
      # One access mode is required (the server refuses to start without it):
      #   shared:      HORA_MCP_TOKEN for callers, HORA_API_KEY (one of API_KEYS) upstream
      #   passthrough: HORA_MCP_PASSTHROUGH=true, each caller's own hora-api key as the bearer
      HORA_API_KEY: ${HORA_API_KEY:-}
      HORA_MCP_TOKEN: ${HORA_MCP_TOKEN:-}
      HORA_MCP_PASSTHROUGH: ${HORA_MCP_PASSTHROUGH:-}
      HORA_MCP_ALLOWED_HOSTS: ${HORA_MCP_ALLOWED_HOSTS:-}
    ports:
      - "${MCP_PUBLISH:-0.0.0.0:8765}:8765"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Restarts containers that report "unhealthy" (Docker itself only restarts ones that exit),
  # at most WATCHER_MAX_RESTARTS per WATCHER_WINDOW seconds each, then gives up and says so in
  # the status file. It needs the Docker socket: see docs/self-hosting.md before enabling.
  watcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: watcher
    image: hora-watcher:local
    restart: unless-stopped
    user: "10001:10001"
    # Group that owns the Docker socket on the host: stat -c %g /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in deploy/.env}"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      WATCHER_INTERVAL: ${WATCHER_INTERVAL:-15}
      WATCHER_MAX_RESTARTS: ${WATCHER_MAX_RESTARTS:-3}
      WATCHER_WINDOW: ${WATCHER_WINDOW:-1800}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The status file lives on the host so scripts/smoke.sh or a monitor can read it. The
      # directory must be writable by uid 10001.
      - ${WATCHER_STATUS_DIR:-./watcher-status}:/status
    healthcheck:
      test: ["CMD", "python", "/app/watcher.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
