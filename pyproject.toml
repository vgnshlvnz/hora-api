[project]
name = "hora-api"
version = "0.2.0"
description = "HTTP API for favourable horas and time windows for a person, date and place"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "pyswisseph",
  "pyyaml",
  "structlog",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  "types-PyYAML",
  "httpx",
  "openapi-spec-validator>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hora_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "mcp-server/src", "mcp-server/tests"]
# mcp-server is its own project with its own ruff, mypy and pytest configuration.
extend-exclude = ["mcp-server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

# pyswisseph ships no type stubs.
[[tool.mypy.overrides]]
module = ["swisseph"]
ignore_missing_imports = true
