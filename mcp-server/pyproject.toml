[project]
name = "hora-mcp"
version = "0.1.0"
description = "MCP server (streamable HTTP) wrapping the hora-api HTTP API"
requires-python = ">=3.12"
dependencies = [
  "mcp",
  "httpx",
]

[project.scripts]
hora-mcp = "hora_mcp.server:main"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hora_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
