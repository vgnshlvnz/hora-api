# Source: Chandrabala (Moon's house counted from the janma rasi), Muhurta Chintamani and common
#   panchangam usage. Good 1, 3, 6, 7, 10, 11; bad 4, 8, 12; 2, 5, 9 are conditional (some
#   traditions allow them in shukla paksha), so their value is configurable. House 8 is
#   Chandrashtama, which is a hard block handled in hora_api.core.day, not a penalty.
# house = ((moon_rasi - janma_rasi) mod 12) + 1.
verify: false
houses:
  1: good
  2: conditional
  3: good
  4: bad
  5: conditional
  6: good
  7: good
  8: bad
  9: conditional
  10: good
  11: good
  12: bad
