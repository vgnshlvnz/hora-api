# Source: Gowri Panchangam (Nalla Neram) as published by Drik Panchang, which says it follows the
#   table in the Pambu Panchangam of Tamil Nadu. Checked against Drik Panchang for Kuala Lumpur
#   (geoname-id 1735161), 2026-11-01 (Sun) to 2026-11-07 (Sat); every weekday's day and night
#   sequences were read from that page. The first guess was WRONG: rows were built as a simple
#   cycle starting at the weekday's own name, but Drik's table is not a cycle (from Monday on,
#   the order of Visham, Uthi, Amirdha and others differs). Only Sunday's day and night and
#   Wednesday's day were right; the other 11 sequences are replaced.
#   Nature: Drik calls Uthi good ("five good: Amirdha, Dhanam, Uthi, Laabam, Sugam; three bad:
#   Rogam, Soram, Visham"); the old table had Uthi bad. Corrected.
#   Saturday night stays verify: true: Drik's page printed Soram twice (segments 4 and 8) and no
#   Rogam. The eight names must each occur once, so Rogam is used for segment 8; this is an
#   inference, not a Drik value. Check against a printed panchangam or a later Drik page.
# Day (sunrise to sunset) and night (sunset to next sunrise) are each split into 8 equal
# segments, listed in order below. Reported as its own layer, never blended into scores.
verify: true
segments: 8
nature:
  good: [Amirdha, Laabam, Dhanam, Sugam, Uthi]
  bad: [Rogam, Soram, Visham]
weekdays:
  sunday:
    verify: false  # Drik Panchang, KL, 2026-11-01
    day: [Uthi, Amirdha, Rogam, Laabam, Dhanam, Sugam, Soram, Visham]
    night: [Dhanam, Sugam, Soram, Visham, Uthi, Amirdha, Rogam, Laabam]
  monday:
    verify: false  # Drik Panchang, KL, 2026-11-02
    day: [Amirdha, Visham, Rogam, Laabam, Dhanam, Sugam, Soram, Uthi]
    night: [Sugam, Soram, Uthi, Amirdha, Visham, Rogam, Laabam, Dhanam]
  tuesday:
    verify: false  # Drik Panchang, KL, 2026-11-03
    day: [Rogam, Laabam, Dhanam, Sugam, Soram, Uthi, Visham, Amirdha]
    night: [Soram, Uthi, Visham, Amirdha, Rogam, Laabam, Dhanam, Sugam]
  wednesday:
    verify: false  # Drik Panchang, KL, 2026-11-04
    day: [Laabam, Dhanam, Sugam, Soram, Visham, Uthi, Amirdha, Rogam]
    night: [Uthi, Amirdha, Rogam, Laabam, Dhanam, Sugam, Soram, Visham]
  thursday:
    verify: false  # Drik Panchang, KL, 2026-11-05
    day: [Dhanam, Sugam, Soram, Uthi, Amirdha, Visham, Rogam, Laabam]
    night: [Amirdha, Visham, Rogam, Laabam, Dhanam, Sugam, Soram, Uthi]
  friday:
    verify: false  # Drik Panchang, KL, 2026-11-06
    day: [Sugam, Soram, Uthi, Visham, Amirdha, Rogam, Laabam, Dhanam]
    night: [Rogam, Laabam, Dhanam, Sugam, Soram, Uthi, Visham, Amirdha]
  saturday:
    verify: true  # Drik Panchang, KL, 2026-11-07
    day: [Soram, Uthi, Visham, Amirdha, Rogam, Laabam, Dhanam, Sugam]
    night: [Laabam, Dhanam, Sugam, Soram, Uthi, Visham, Amirdha, Rogam]  # 8th is inferred, see header
